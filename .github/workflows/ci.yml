name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Linter
        run: npm run lint
        continue-on-error: true

      - name: Next.js Build Check
        run: npm run build
        env:
          GROQ_API_KEY: "dummy-key-for-build"
          TMDB_API_KEY: "dummy-key-for-build"

      - name: Verify Docker Build
        run: docker build -t aurascript-test .
